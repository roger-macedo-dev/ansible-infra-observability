---
- name: Subir Prometheus no node1
  hosts: nodes
  become: true

  tasks:
    - name: Criar diretório de config do Prometheus
      ansible.builtin.file:
        path: /opt/prometheus
        state: directory
        mode: '0755'

    - name: Copiar prometheus.yml para o node1
      ansible.builtin.copy:
        src: files/prometheus.yml
        dest: /opt/prometheus/prometheus.yml
        mode: '0644'

    - name: Subir container Prometheus
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: always
        ports:
          - "9091:9090"
        volumes:
          - /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
